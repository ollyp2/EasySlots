<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <!-- Dynamically rendered by sidebar.js -->
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">My Tickets</h1>
                    </div>

                    <!-- Tickets Grid -->
                    <div class="tickets-grid" id="tickets-grid">
                        <!-- Loaded dynamically -->
                    </div>

                    <div class="empty-state" id="empty-state" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path></svg>
                        <h3>No tickets yet</h3>
                        <p>Your tickets will appear here after booking</p>
                        <a href="/pages/events/index.html" class="btn btn-primary">Browse Events</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="loader"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/buyerTickets.js"></script>
</body>
</html>
