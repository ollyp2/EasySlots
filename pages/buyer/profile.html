<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <!-- Dynamically rendered by sidebar.js -->
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">Buyer Settings</h1>
                    </div>

                    <form class="profile-form" id="profile-form">
                        <!-- Personal Information -->
                        <section class="form-section">
                            <h2 class="form-section__title">Personal Information</h2>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label" for="first-name">First Name</label>
                                    <input type="text" class="form-input" id="first-name" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="last-name">Last Name</label>
                                    <input type="text" class="form-input" id="last-name" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" class="form-input" id="email" disabled>
                                <p class="form-hint">Email cannot be changed</p>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="phone">Phone</label>
                                <input type="tel" class="form-input" id="phone">
                            </div>
                        </section>

                        <!-- Theme Settings -->
                        <section class="form-section">
                            <h2 class="form-section__title">Appearance</h2>

                            <!-- Dark Mode -->
                            <div class="form-group">
                                <label class="form-label">Dark Mode</label>
                                <div class="toggle-container">
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="dark-mode-toggle">
                                        <span class="toggle-slider"></span>
                                    </label>
                                    <span class="toggle-label" id="dark-mode-label">Off</span>
                                </div>
                            </div>

                            <!-- Theme Color -->
                            <div class="form-group">
                                <label class="form-label">Theme Color</label>
                                <div class="color-picker-container">
                                    <div class="color-presets">
                                        <button type="button" class="color-preset" data-color="#4A90A4" style="background:#4A90A4" title="Default Blue"></button>
                                        <button type="button" class="color-preset" data-color="#28A745" style="background:#28A745" title="Green"></button>
                                        <button type="button" class="color-preset" data-color="#6366F1" style="background:#6366F1" title="Indigo"></button>
                                        <button type="button" class="color-preset" data-color="#EC4899" style="background:#EC4899" title="Pink"></button>
                                        <button type="button" class="color-preset" data-color="#F59E0B" style="background:#F59E0B" title="Amber"></button>
                                        <button type="button" class="color-preset" data-color="#EF4444" style="background:#EF4444" title="Red"></button>
                                    </div>
                                    <div class="custom-color">
                                        <label class="form-label-sm">Custom:</label>
                                        <input type="color" id="custom-color-picker" class="color-input" value="#4A90A4">
                                        <button type="button" class="btn btn-sm btn-ghost" id="reset-color">Reset</button>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Vendor Mode Section (only shown for vendors) -->
                        <section class="form-section" id="vendor-mode-section" style="display: none;">
                            <h2 class="form-section__title">Seller Mode</h2>
                            <p class="form-text">Switch between buyer and seller mode to manage your events.</p>
                            <div class="toggle-container">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="profile-seller-toggle">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="toggle-label" id="toggle-label-text">Seller Mode OFF</span>
                            </div>
                        </section>

                        <!-- Become a Vendor Section (only shown for non-vendors) -->
                        <section class="form-section" id="become-vendor-section">
                            <h2 class="form-section__title">Upgrade to Vendor</h2>
                            <p class="form-text">Want to sell your own events and services? Upgrade your account to start listing events.</p>
                            <a href="/pages/auth/register.html?upgrade=vendor" class="btn btn-outline">Upgrade to Vendor</a>
                        </section>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
