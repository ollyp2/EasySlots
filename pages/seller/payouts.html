<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payouts - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">
    <link rel="stylesheet" href="/css/pages/seller.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <!-- Dynamically rendered by sidebar.js -->
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">Payouts</h1>
                    </div>

                    <!-- Balance Card -->
                    <div class="balance-card">
                        <div class="balance-card__available">
                            <span class="balance-label">Available Balance</span>
                            <span class="balance-amount" id="available-balance">€0.00</span>
                        </div>
                        <div class="balance-card__pending">
                            <span class="balance-label">Pending</span>
                            <span class="balance-amount" id="pending-balance">€0.00</span>
                        </div>
                        <div class="balance-card__actions">
                            <a href="#" class="btn btn-primary" id="stripe-dashboard">Stripe Dashboard</a>
                        </div>
                    </div>

                    <!-- Payout History -->
                    <section class="dashboard-section">
                        <h2 class="section-title">Payout History</h2>
                        <div class="table-responsive">
                            <table class="table" id="payouts-table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Description</th>
                                    </tr>
                                </thead>
                                <tbody id="payouts-tbody">
                                    <!-- Loaded dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <!-- Stripe Connect Setup -->
                    <section class="dashboard-section" id="stripe-setup" style="display: none;">
                        <div class="setup-card">
                            <h2>Set up payouts</h2>
                            <p>Connect your Stripe account to start receiving payouts for your bookings.</p>
                            <button class="btn btn-primary" id="connect-stripe">Connect Stripe</button>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
