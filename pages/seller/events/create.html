<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event - EasySlots</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/calendar.css">
    <link rel="stylesheet" href="/css/seating.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">
    <link rel="stylesheet" href="/css/pages/seller.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container container--narrow">
            <div class="page-header">
                <a href="/pages/seller/events/index.html" class="back-link">&larr; Back to Events</a>
                <h1 class="page-title">Create Event</h1>
            </div>

            <form class="event-form" id="event-form">
                <!-- Basic Info -->
                <section class="form-section">
                    <h2 class="form-section__title">Basic Information</h2>
                    <div class="form-group">
                        <label class="form-label" for="title">Event Title *</label>
                        <input type="text" class="form-input" id="title" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="description">Description *</label>
                        <textarea class="form-textarea" id="description" rows="5" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="category">Category *</label>
                            <select class="form-select" id="category" required>
                                <option value="">Select category</option>
                                <option value="fitness">Fitness</option>
                                <option value="music">Music</option>
                                <option value="coaching">Coaching</option>
                                <option value="rentals">Rentals</option>
                                <option value="workshop">Workshop</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="price">Price (€) *</label>
                            <input type="number" class="form-input" id="price" min="0" step="0.01" required>
                        </div>
                    </div>
                </section>

                <!-- Image Upload -->
                <section class="form-section">
                    <h2 class="form-section__title">Event Image</h2>
                    <div class="image-upload" id="image-upload">
                        <input type="file" id="image" accept="image/*" hidden>
                        <div class="image-upload__preview" id="image-preview">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            <p>Click to upload image</p>
                        </div>
                    </div>
                </section>

                <!-- Location -->
                <section class="form-section">
                    <h2 class="form-section__title">Location</h2>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="is-online">
                            <span>This is an online event</span>
                        </label>
                    </div>
                    <div id="location-fields">
                        <div class="form-group">
                            <label class="form-label" for="address">Address *</label>
                            <input type="text" class="form-input" id="address">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="city">City *</label>
                                <input type="text" class="form-input" id="city">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="postal-code">Postal Code</label>
                                <input type="text" class="form-input" id="postal-code">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Schedule -->
                <section class="form-section">
                    <h2 class="form-section__title">Schedule</h2>
                    <div class="form-group">
                        <label class="form-label">Event Type *</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="event-type" value="single" checked>
                                <span>Single Event</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="event-type" value="recurring">
                                <span>Recurring Slots</span>
                            </label>
                        </div>
                    </div>

                    <!-- Single Event Fields -->
                    <div id="single-event-fields">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="event-date">Date *</label>
                                <input type="date" class="form-input" id="event-date">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="event-time">Start Time *</label>
                                <input type="time" class="form-input" id="event-time">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="duration">Duration (minutes) *</label>
                            <input type="number" class="form-input" id="duration" min="15" step="15" value="60">
                        </div>
                    </div>

                    <!-- Recurring Slots Fields -->
                    <div id="recurring-fields" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="start-date">Start Date *</label>
                                <input type="date" class="form-input" id="start-date">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="end-date">End Date *</label>
                                <input type="date" class="form-input" id="end-date">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Repeat Days *</label>
                            <div class="checkbox-group checkbox-group--days">
                                <label class="checkbox-day"><input type="checkbox" name="days" value="0"><span>Sun</span></label>
                                <label class="checkbox-day"><input type="checkbox" name="days" value="1"><span>Mon</span></label>
                                <label class="checkbox-day"><input type="checkbox" name="days" value="2"><span>Tue</span></label>
                                <label class="checkbox-day"><input type="checkbox" name="days" value="3"><span>Wed</span></label>
                                <label class="checkbox-day"><input type="checkbox" name="days" value="4"><span>Thu</span></label>
                                <label class="checkbox-day"><input type="checkbox" name="days" value="5"><span>Fri</span></label>
                                <label class="checkbox-day"><input type="checkbox" name="days" value="6"><span>Sat</span></label>
                            </div>
                        </div>
                        <div class="slots-builder" id="slots-builder">
                            <div class="slots-builder__header">
                                <label class="form-label">Time Slots</label>
                                <button type="button" class="btn btn-sm btn-outline" id="add-slot">Add Slot</button>
                            </div>
                            <div class="slots-list" id="slots-list">
                                <!-- Slots added dynamically -->
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Capacity -->
                <section class="form-section">
                    <h2 class="form-section__title">Capacity</h2>
                    <div class="form-group">
                        <label class="form-label">Booking Type *</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="booking-type" value="spots" checked>
                                <span>Simple Spots (e.g., 20 spots available)</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="booking-type" value="seating">
                                <span>Assigned Seating</span>
                            </label>
                        </div>
                    </div>

                    <div id="spots-fields">
                        <div class="form-group">
                            <label class="form-label" for="max-spots">Maximum Spots *</label>
                            <input type="number" class="form-input" id="max-spots" min="1" value="20">
                        </div>
                    </div>

                    <div id="seating-fields" style="display: none;">
                        <p class="form-hint">Design your seating chart below</p>
                        <div class="seating-builder" id="seating-builder">
                            <!-- Seating chart builder -->
                        </div>
                    </div>
                </section>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="save-draft">Save as Draft</button>
                    <button type="submit" class="btn btn-primary">Publish Event</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="loader"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/eventEditor.js"></script>
</body>
</html>
