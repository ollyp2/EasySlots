<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - EasySlots</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/calendar.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">
    <link rel="stylesheet" href="/css/pages/seller.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container container--narrow">
            <div class="page-header">
                <a href="/pages/seller/events/index.html" class="back-link">&larr; Back to Events</a>
                <h1 class="page-title">Edit Event</h1>
            </div>

            <form class="event-form" id="event-form">
                <!-- Basic Info -->
                <section class="form-section">
                    <h2 class="form-section__title">Basic Information</h2>
                    <div class="form-group">
                        <label class="form-label" for="title">Event Title *</label>
                        <input type="text" class="form-input" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="shortDescription">Short Description</label>
                        <input type="text" class="form-input" id="shortDescription" name="shortDescription" maxlength="160" placeholder="Brief description for listings">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="description">Full Description *</label>
                        <textarea class="form-textarea" id="description" name="description" rows="5" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="category">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="">Select category</option>
                                <option value="fitness">Fitness</option>
                                <option value="music">Music</option>
                                <option value="coaching">Coaching</option>
                                <option value="rentals">Rentals</option>
                                <option value="workshop">Workshop</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="eventType">Event Type *</label>
                            <select class="form-select" id="eventType" name="eventType" required>
                                <option value="">Select type</option>
                                <option value="class">Class</option>
                                <option value="workshop">Workshop</option>
                                <option value="appointment">Appointment</option>
                                <option value="rental">Rental</option>
                                <option value="event">Event</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="basePrice">Price (EUR) *</label>
                            <input type="number" class="form-input" id="basePrice" name="basePrice" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="capacity">Default Capacity *</label>
                            <input type="number" class="form-input" id="capacity" name="capacity" min="1" value="10" required>
                        </div>
                    </div>
                </section>

                <!-- Image Upload -->
                <section class="form-section">
                    <h2 class="form-section__title">Event Image</h2>
                    <div class="image-upload">
                        <div class="image-drop-zone" id="image-drop-zone">
                            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <p>Drag & drop an image or click to browse</p>
                            <input type="file" id="event-image" accept="image/*" hidden>
                            <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('event-image').click()">Choose File</button>
                        </div>
                        <div class="image-preview" id="image-preview" style="display: none;"></div>
                        <button type="button" class="btn btn-ghost btn-sm" id="remove-image-btn" style="display: none;">Remove Image</button>
                    </div>
                </section>

                <!-- Location -->
                <section class="form-section">
                    <h2 class="form-section__title">Location</h2>
                    <div class="form-group">
                        <label class="form-label" for="locationType">Location Type *</label>
                        <select class="form-select" id="locationType" name="locationType" required>
                            <option value="physical">Physical Location</option>
                            <option value="online">Online</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="location">Address / Meeting Link</label>
                        <input type="text" class="form-input" id="location" name="location" placeholder="Enter address or online meeting link">
                    </div>
                </section>

                <!-- Time Slots -->
                <section class="form-section">
                    <div class="form-section__header">
                        <h2 class="form-section__title">Time Slots</h2>
                        <button type="button" class="btn btn-outline btn-sm" id="add-slot-btn">Add Slot</button>
                    </div>
                    <p class="form-hint">Add time slots for when this event is available for booking.</p>
                    <div class="slots-list" id="slots-list">
                        <!-- Slots loaded dynamically -->
                    </div>
                </section>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="save-draft-btn">Save as Draft</button>
                    <button type="button" class="btn btn-primary" id="publish-btn">Save & Publish</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Slot Modal -->
    <div class="modal" id="slot-modal" style="display: none;">
        <div class="modal__overlay"></div>
        <div class="modal__content">
            <div class="modal__header">
                <h3 class="modal__title">Add Time Slot</h3>
                <button type="button" class="modal__close" data-close-modal>&times;</button>
            </div>
            <form class="modal__body">
                <div class="form-group">
                    <label class="form-label" for="slot-date">Date *</label>
                    <input type="date" class="form-input" id="slot-date" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="slot-start-time">Start Time *</label>
                        <input type="time" class="form-input" id="slot-start-time" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="slot-end-time">End Time *</label>
                        <input type="time" class="form-input" id="slot-end-time" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="slot-capacity">Capacity</label>
                        <input type="number" class="form-input" id="slot-capacity" min="1" placeholder="Default: event capacity">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="slot-price">Price Override (EUR)</label>
                        <input type="number" class="form-input" id="slot-price" min="0" step="0.01" placeholder="Default: event price">
                    </div>
                </div>
            </form>
            <div class="modal__footer">
                <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
                <button type="button" class="btn btn-primary" data-save-slot>Save Slot</button>
            </div>
        </div>
    </div>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="loader"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/eventEditor.js"></script>
</body>
</html>
