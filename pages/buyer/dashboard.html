<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <!-- Sidebar Navigation -->
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <!-- Dynamically rendered by sidebar.js -->
                    </nav>
                </aside>

                <!-- Main Content -->
                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">My Dashboard</h1>
                    </div>

                    <!-- Stats Cards -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-card__value" id="upcoming-bookings">0</div>
                            <div class="stat-card__label">Upcoming Bookings</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__value" id="completed-bookings">0</div>
                            <div class="stat-card__label">Completed</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__value" id="total-spent">$0</div>
                            <div class="stat-card__label">Total Spent</div>
                        </div>
                    </div>

                    <!-- Upcoming Bookings -->
                    <section class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">Upcoming Bookings</h2>
                            <a href="/pages/buyer/bookings.html" class="section-link">View all</a>
                        </div>
                        <div class="bookings-list" id="upcoming-bookings-list">
                            <!-- Loaded dynamically -->
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="loader"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/buyerDashboard.js"></script>
</body>
</html>
