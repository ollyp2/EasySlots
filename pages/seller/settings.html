<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Settings - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">
    <link rel="stylesheet" href="/css/pages/seller.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <!-- Dynamically rendered by sidebar.js -->
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">Settings</h1>
                    </div>

                    <form class="settings-form" id="settings-form">
                        <!-- Personal Information (Shared) -->
                        <section class="form-section">
                            <h2 class="form-section__title">Personal Information</h2>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label" for="first-name">First Name</label>
                                    <input type="text" class="form-input" id="first-name" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="last-name">Last Name</label>
                                    <input type="text" class="form-input" id="last-name" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" class="form-input" id="email" disabled>
                                <p class="form-hint">Email cannot be changed</p>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="phone">Phone</label>
                                <input type="tel" class="form-input" id="phone">
                            </div>
                        </section>

                        <!-- Appearance Settings (Shared) -->
                        <section class="form-section">
                            <h2 class="form-section__title">Appearance</h2>

                            <!-- Dark Mode -->
                            <div class="form-group">
                                <label class="form-label">Dark Mode</label>
                                <div class="toggle-container">
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="dark-mode-toggle">
                                        <span class="toggle-slider"></span>
                                    </label>
                                    <span class="toggle-label" id="dark-mode-label">Off</span>
                                </div>
                            </div>

                            <!-- Buy-Mode Color -->
                            <div class="form-group">
                                <label class="form-label">Buy-Mode Color</label>
                                <p class="form-hint">Theme color when browsing as a buyer</p>
                                <div class="color-picker-container">
                                    <div class="color-presets" id="buyer-color-presets">
                                        <button type="button" class="color-preset" data-color="#4A90A4" data-mode="buyer" style="background:#4A90A4" title="Default Blue"></button>
                                        <button type="button" class="color-preset" data-color="#6366F1" data-mode="buyer" style="background:#6366F1" title="Indigo"></button>
                                        <button type="button" class="color-preset" data-color="#8B5CF6" data-mode="buyer" style="background:#8B5CF6" title="Purple"></button>
                                        <button type="button" class="color-preset" data-color="#EC4899" data-mode="buyer" style="background:#EC4899" title="Pink"></button>
                                        <button type="button" class="color-preset" data-color="#F59E0B" data-mode="buyer" style="background:#F59E0B" title="Amber"></button>
                                        <button type="button" class="color-preset" data-color="#EF4444" data-mode="buyer" style="background:#EF4444" title="Red"></button>
                                    </div>
                                    <div class="custom-color">
                                        <label class="form-label-sm">Custom:</label>
                                        <input type="color" id="buyer-color-picker" class="color-input" value="#4A90A4">
                                        <button type="button" class="btn btn-sm btn-ghost" id="reset-buyer-color">Reset</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Seller-Mode Color -->
                            <div class="form-group">
                                <label class="form-label">Seller-Mode Color</label>
                                <p class="form-hint">Theme color when managing events as a seller</p>
                                <div class="color-picker-container">
                                    <div class="color-presets" id="seller-color-presets">
                                        <button type="button" class="color-preset" data-color="#28A745" data-mode="seller" style="background:#28A745" title="Default Green"></button>
                                        <button type="button" class="color-preset" data-color="#10B981" data-mode="seller" style="background:#10B981" title="Emerald"></button>
                                        <button type="button" class="color-preset" data-color="#14B8A6" data-mode="seller" style="background:#14B8A6" title="Teal"></button>
                                        <button type="button" class="color-preset" data-color="#06B6D4" data-mode="seller" style="background:#06B6D4" title="Cyan"></button>
                                        <button type="button" class="color-preset" data-color="#84CC16" data-mode="seller" style="background:#84CC16" title="Lime"></button>
                                        <button type="button" class="color-preset" data-color="#22C55E" data-mode="seller" style="background:#22C55E" title="Green"></button>
                                    </div>
                                    <div class="custom-color">
                                        <label class="form-label-sm">Custom:</label>
                                        <input type="color" id="seller-color-picker" class="color-input" value="#28A745">
                                        <button type="button" class="btn btn-sm btn-ghost" id="reset-seller-color">Reset</button>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Business Information (Seller-Exclusive) -->
                        <section class="form-section">
                            <h2 class="form-section__title">Business Information</h2>
                            <div class="form-group">
                                <label class="form-label" for="business-name">Business Name *</label>
                                <input type="text" class="form-input" id="business-name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="business-description">Description</label>
                                <textarea class="form-textarea" id="business-description" rows="4" placeholder="Tell customers about your business..."></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Logo</label>
                                <div class="image-upload image-upload--avatar" id="logo-upload">
                                    <input type="file" id="logo" accept="image/*" hidden>
                                    <div class="image-upload__preview" id="logo-preview"></div>
                                    <button type="button" class="btn btn-sm btn-outline">Change Logo</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="contact-email">Contact Email *</label>
                                <input type="email" class="form-input" id="contact-email" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="contact-phone">Contact Phone</label>
                                <input type="tel" class="form-input" id="contact-phone" placeholder="+49 123 456789">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="website">Website</label>
                                <input type="url" class="form-input" id="website" placeholder="https://">
                            </div>
                        </section>

                        <!-- Business Location (Seller-Exclusive) -->
                        <section class="form-section">
                            <h2 class="form-section__title">Business Location</h2>
                            <div class="form-group">
                                <label class="form-label" for="default-address">Address</label>
                                <input type="text" class="form-input" id="default-address" placeholder="Street address">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label" for="default-city">City</label>
                                    <input type="text" class="form-input" id="default-city">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="default-postal">Postal Code</label>
                                    <input type="text" class="form-input" id="default-postal">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="default-country">Country</label>
                                <input type="text" class="form-input" id="default-country">
                            </div>
                        </section>

                        <!-- Booking Settings (Seller-Exclusive) -->
                        <section class="form-section">
                            <h2 class="form-section__title">Booking Settings</h2>
                            <div class="form-group">
                                <label class="form-label" for="cancellation-policy">Cancellation Policy</label>
                                <select class="form-select" id="cancellation-policy">
                                    <option value="flexible">Flexible - Full refund up to 24h before</option>
                                    <option value="moderate">Moderate - Full refund up to 7 days before</option>
                                    <option value="strict">Strict - 50% refund up to 7 days before</option>
                                    <option value="none">No refunds</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="auto-confirm">
                                    <span>Auto-confirm bookings (no manual approval required)</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="require-payment">
                                    <span>Require payment at booking</span>
                                </label>
                            </div>
                        </section>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Settings</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/sellerSettings.js"></script>
</body>
</html>
