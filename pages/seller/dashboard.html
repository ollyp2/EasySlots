<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">
    <link rel="stylesheet" href="/css/pages/seller.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <!-- Dynamically rendered by sidebar.js -->
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">Vendor Dashboard</h1>
                        <a href="/pages/seller/events/create.html" class="btn btn-primary">Create Event</a>
                    </div>

                    <!-- Stats Cards -->
                    <div class="stats-grid stats-grid--4">
                        <div class="stat-card">
                            <div class="stat-card__value" id="revenue-today">€0</div>
                            <div class="stat-card__label">Today's Revenue</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__value" id="bookings-today">0</div>
                            <div class="stat-card__label">Today's Bookings</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__value" id="active-events">0</div>
                            <div class="stat-card__label">Active Events</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__value" id="pending-payouts">€0</div>
                            <div class="stat-card__label">Pending Payouts</div>
                        </div>
                    </div>

                    <!-- Recent Bookings -->
                    <section class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">Recent Bookings</h2>
                            <a href="/pages/seller/bookings.html" class="section-link">View all</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table" id="recent-bookings">
                                <thead>
                                    <tr>
                                        <th>Customer</th>
                                        <th>Event</th>
                                        <th>Date</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Loaded dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <!-- Upcoming Events -->
                    <section class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">Upcoming Events</h2>
                            <a href="/pages/seller/events/index.html" class="section-link">View all</a>
                        </div>
                        <div class="events-list" id="upcoming-events">
                            <!-- Loaded dynamically -->
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/sellerDashboard.js"></script>
</body>
</html>
