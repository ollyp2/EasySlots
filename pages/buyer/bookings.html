<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <a href="/pages/buyer/dashboard.html" class="dashboard-nav__item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            Dashboard
                        </a>
                        <a href="/pages/buyer/bookings.html" class="dashboard-nav__item dashboard-nav__item--active">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            My Bookings
                        </a>
                        <a href="/pages/buyer/tickets.html" class="dashboard-nav__item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path></svg>
                            My Tickets
                        </a>
                        <a href="/pages/buyer/profile.html" class="dashboard-nav__item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            Profile
                        </a>
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">My Bookings</h1>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="tabs" id="booking-tabs">
                        <button class="tab tab--active" data-filter="upcoming">Upcoming</button>
                        <button class="tab" data-filter="past">Past</button>
                        <button class="tab" data-filter="cancelled">Cancelled</button>
                    </div>

                    <!-- Bookings List -->
                    <div class="bookings-list" id="bookings-list">
                        <!-- Loaded dynamically -->
                    </div>

                    <div class="empty-state" id="empty-state" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <h3>No bookings yet</h3>
                        <p>Browse events and make your first booking</p>
                        <a href="/pages/events/index.html" class="btn btn-primary">Browse Events</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Cancel Confirmation Modal -->
    <div class="modal" id="cancel-modal" style="display: none;">
        <div class="modal__backdrop"></div>
        <div class="modal__content">
            <h3 class="modal__title">Cancel Booking</h3>
            <p class="modal__text">Are you sure you want to cancel this booking? This action cannot be undone.</p>
            <div class="modal__actions">
                <button class="btn btn-outline" id="cancel-modal-close">Keep Booking</button>
                <button class="btn btn-danger" id="cancel-modal-confirm">Yes, Cancel</button>
            </div>
        </div>
    </div>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="loader"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/buyerBookings.js"></script>
</body>
</html>
