<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90A4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A7287;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Calendar icon -->
  <rect x="5" y="8" width="34" height="34" rx="4" stroke="url(#logoGradient)" stroke-width="2.5" fill="none"/>
  <line x1="5" y1="18" x2="39" y2="18" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="14" y1="5" x2="14" y2="12" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="5" x2="30" y2="12" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Slot indicators -->
  <rect x="11" y="24" width="7" height="5" rx="1" fill="#4A90A4"/>
  <rect x="11" y="32" width="7" height="5" rx="1" fill="#F5A623"/>
  <rect x="21" y="24" width="7" height="5" rx="1" fill="#F5A623"/>
  <rect x="21" y="32" width="7" height="5" rx="1" fill="#4A90A4"/>
  <rect x="31" y="24" width="3" height="5" rx="1" fill="#4A90A4"/>

  <!-- Text -->
  <text x="50" y="35" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#1F2937">
    Easy<tspan fill="#4A90A4">Slots</tspan>
  </text>
</svg>
