<!--
    Event Card Template
    Used by JavaScript components to render event cards dynamically
-->
<template id="event-card-template">
    <article class="event-card">
        <a href="/pages/events/detail.html?id={{id}}" class="event-card__link">
            <div class="event-card__image">
                <img src="{{imageUrl}}" alt="{{title}}" loading="lazy">
                {{#featured}}
                <span class="event-card__badge badge badge--primary">Featured</span>
                {{/featured}}
            </div>
            <div class="event-card__content">
                <span class="event-card__category">{{category}}</span>
                <h3 class="event-card__title">{{title}}</h3>
                <div class="event-card__meta">
                    <div class="event-card__meta-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span>{{date}}</span>
                    </div>
                    <div class="event-card__meta-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span>{{location}}</span>
                    </div>
                </div>
                <div class="event-card__footer">
                    <div class="event-card__price">
                        {{price}}
                        <span class="event-card__price-label">/ person</span>
                    </div>
                </div>
            </div>
        </a>
    </article>
</template>
