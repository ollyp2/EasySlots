<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">
    <link rel="stylesheet" href="/css/pages/seller.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <!-- Dynamically rendered by sidebar.js -->
                    </nav>
                </aside>

                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">Bookings</h1>
                        <div class="header-actions">
                            <input type="date" class="form-input" id="date-filter">
                            <select class="form-select" id="event-filter">
                                <option value="">All Events</option>
                            </select>
                        </div>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="tabs">
                        <button class="tab tab--active" data-filter="all">All</button>
                        <button class="tab" data-filter="confirmed">Confirmed</button>
                        <button class="tab" data-filter="pending">Pending</button>
                        <button class="tab" data-filter="cancelled">Cancelled</button>
                    </div>

                    <!-- Bookings Table -->
                    <div class="table-responsive">
                        <table class="table" id="bookings-table">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Customer</th>
                                    <th>Event</th>
                                    <th>Date/Time</th>
                                    <th>Spots</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-tbody">
                                <!-- Loaded dynamically -->
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <!-- Booking Detail Modal -->
    <div class="modal" id="booking-modal">
        <div class="modal__overlay"></div>
        <div class="modal__content" id="booking-detail">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/sellerBookings.js"></script>
</body>
</html>
