<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Profile - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/events.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <!-- Vendor Header -->
            <section class="vendor-header">
                <div class="vendor-header__logo" id="vendor-logo"></div>
                <div class="vendor-header__info">
                    <h1 class="vendor-header__name" id="vendor-name"></h1>
                    <p class="vendor-header__description" id="vendor-description"></p>
                    <div class="vendor-header__meta">
                        <span class="vendor-stat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            <span id="event-count">0</span> Events
                        </span>
                        <span class="vendor-stat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            <span id="booking-count">0</span> Bookings
                        </span>
                    </div>
                </div>
            </section>

            <!-- Vendor Events -->
            <section class="vendor-events">
                <h2 class="section-title">Events by this Vendor</h2>
                <div class="events-grid" id="vendor-events">
                    <!-- Loaded dynamically -->
                </div>
            </section>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/vendorProfile.js"></script>
</body>
</html>
