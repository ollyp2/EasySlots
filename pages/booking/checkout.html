<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - EasySlots</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/pages/booking.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container container--narrow">
            <div class="page-header">
                <h1 class="page-title">Checkout</h1>
            </div>

            <div class="checkout-layout">
                <!-- Checkout Form -->
                <div class="checkout-form">
                    <section class="checkout-section">
                        <h2 class="checkout-section__title">Contact Information</h2>
                        <div class="form-group">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" class="form-input" id="email" required>
                            <p class="form-hint">Confirmation will be sent to this email</p>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="first-name">First Name</label>
                                <input type="text" class="form-input" id="first-name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="last-name">Last Name</label>
                                <input type="text" class="form-input" id="last-name" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">Phone (optional)</label>
                            <input type="tel" class="form-input" id="phone">
                        </div>
                    </section>

                    <section class="checkout-section">
                        <h2 class="checkout-section__title">Additional Information</h2>
                        <div class="form-group">
                            <label class="form-label" for="notes">Notes for vendor (optional)</label>
                            <textarea class="form-textarea" id="notes" rows="3" placeholder="Any special requests or information..."></textarea>
                        </div>
                    </section>

                    <section class="checkout-section">
                        <h2 class="checkout-section__title">Payment</h2>
                        <p class="checkout-info">You'll be redirected to Stripe to complete your payment securely.</p>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="terms" required>
                                <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Cancellation Policy</a></span>
                            </label>
                        </div>
                    </section>

                    <button class="btn btn-primary btn-lg btn-block" id="pay-now">
                        Proceed to Payment
                    </button>
                </div>

                <!-- Order Summary -->
                <aside class="order-summary">
                    <div class="summary-card">
                        <h3 class="summary-card__title">Order Summary</h3>

                        <div class="summary-event" id="summary-event">
                            <!-- Event details loaded dynamically -->
                        </div>

                        <div class="summary-details">
                            <div class="summary-row">
                                <span>Date</span>
                                <span id="summary-date">-</span>
                            </div>
                            <div class="summary-row">
                                <span>Time</span>
                                <span id="summary-time">-</span>
                            </div>
                            <div class="summary-row">
                                <span>Quantity</span>
                                <span id="summary-quantity">-</span>
                            </div>
                        </div>

                        <div class="summary-pricing">
                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span id="summary-subtotal">€0.00</span>
                            </div>
                            <div class="summary-row">
                                <span>Service fee</span>
                                <span id="summary-fee">€0.00</span>
                            </div>
                            <div class="summary-row summary-total">
                                <span>Total</span>
                                <span id="summary-total">€0.00</span>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="loader"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
