<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - EasySeats</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/calendar.css">
    <link rel="stylesheet" href="/css/seating.css">
    <link rel="stylesheet" href="/css/pages/events.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <!-- Event Hero -->
            <section class="event-hero">
                <div class="event-hero__image" id="event-image"></div>
                <div class="event-hero__content">
                    <div class="event-hero__badges">
                        <span class="badge" id="event-category"></span>
                    </div>
                    <h1 class="event-hero__title" id="event-title"></h1>
                    <p class="event-hero__vendor">
                        by <a href="#" id="vendor-link"></a>
                    </p>
                </div>
            </section>

            <div class="event-layout">
                <!-- Event Details -->
                <div class="event-details">
                    <section class="event-section">
                        <h2 class="event-section__title">About this event</h2>
                        <div class="event-description" id="event-description"></div>
                    </section>

                    <section class="event-section">
                        <h2 class="event-section__title">Location</h2>
                        <div class="event-location" id="event-location"></div>
                    </section>

                    <section class="event-section">
                        <h2 class="event-section__title">Vendor</h2>
                        <div class="vendor-card" id="vendor-card"></div>
                    </section>
                </div>

                <!-- Booking Sidebar -->
                <aside class="booking-sidebar">
                    <div class="booking-card">
                        <div class="booking-card__price">
                            <span class="price" id="event-price"></span>
                            <span class="price-label">per person</span>
                        </div>

                        <!-- Calendar/Slot Picker -->
                        <div class="booking-calendar" id="booking-calendar"></div>

                        <!-- Slot Selection -->
                        <div class="slot-picker" id="slot-picker"></div>

                        <!-- Seating Chart (if applicable) -->
                        <div class="seating-chart-container" id="seating-container" style="display: none;"></div>

                        <!-- Quantity -->
                        <div class="booking-quantity">
                            <label class="form-label">Number of spots</label>
                            <div class="quantity-selector">
                                <button class="quantity-btn" id="qty-decrease">-</button>
                                <input type="number" class="quantity-input" id="quantity" value="1" min="1">
                                <button class="quantity-btn" id="qty-increase">+</button>
                            </div>
                            <p class="spots-available"><span id="spots-left">0</span> spots left</p>
                        </div>

                        <!-- Summary -->
                        <div class="booking-summary">
                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span id="subtotal">€0.00</span>
                            </div>
                            <div class="summary-row summary-total">
                                <span>Total</span>
                                <span id="total">€0.00</span>
                            </div>
                        </div>

                        <button class="btn btn-primary btn-block" id="book-now" disabled>
                            Select a date & time
                        </button>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/eventDetail.js"></script>
</body>
</html>
