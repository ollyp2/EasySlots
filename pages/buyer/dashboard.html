<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - EasySlots</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container">
            <div class="dashboard-layout">
                <!-- Sidebar Navigation -->
                <aside class="dashboard-sidebar">
                    <nav class="dashboard-nav">
                        <a href="/pages/buyer/dashboard.html" class="dashboard-nav__item dashboard-nav__item--active">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            Dashboard
                        </a>
                        <a href="/pages/buyer/bookings.html" class="dashboard-nav__item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            My Bookings
                        </a>
                        <a href="/pages/buyer/tickets.html" class="dashboard-nav__item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path></svg>
                            My Tickets
                        </a>
                        <a href="/pages/buyer/profile.html" class="dashboard-nav__item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            Profile
                        </a>
                    </nav>
                </aside>

                <!-- Main Content -->
                <div class="dashboard-content">
                    <div class="dashboard-header">
                        <h1 class="dashboard-title">Welcome back, <span id="user-name"></span></h1>
                    </div>

                    <!-- Stats Cards -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-card__value" id="upcoming-count">0</div>
                            <div class="stat-card__label">Upcoming Events</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__value" id="total-bookings">0</div>
                            <div class="stat-card__label">Total Bookings</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card__value" id="tickets-count">0</div>
                            <div class="stat-card__label">Active Tickets</div>
                        </div>
                    </div>

                    <!-- Upcoming Events -->
                    <section class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">Upcoming Events</h2>
                            <a href="/pages/buyer/bookings.html" class="section-link">View all</a>
                        </div>
                        <div class="bookings-list" id="upcoming-events">
                            <!-- Loaded dynamically -->
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/buyerDashboard.js"></script>
</body>
</html>
