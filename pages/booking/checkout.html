<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - EasySlots</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/pages/booking.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header"></header>

    <main class="main">
        <div class="container container--narrow">
            <div class="page-header">
                <h1 class="page-title">Checkout</h1>
            </div>

            <div class="checkout-layout">
                <!-- Checkout Form -->
                <div class="checkout-form">
                    <form id="checkout-form">
                        <section class="checkout-section">
                            <h2 class="checkout-section__title">Contact Information</h2>
                            <div class="form-group">
                                <label class="form-label" for="customer-email">Email</label>
                                <input type="email" class="form-input" id="customer-email" required>
                                <p class="form-hint">Confirmation will be sent to this email</p>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="customer-name">Full Name</label>
                                <input type="text" class="form-input" id="customer-name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="customer-phone">Phone (optional)</label>
                                <input type="tel" class="form-input" id="customer-phone">
                            </div>
                        </section>

                        <section class="checkout-section">
                            <h2 class="checkout-section__title">Additional Information</h2>
                            <div class="form-group">
                                <label class="form-label" for="booking-notes">Notes for vendor (optional)</label>
                                <textarea class="form-textarea" id="booking-notes" rows="3" placeholder="Any special requests or information..."></textarea>
                            </div>
                        </section>

                        <section class="checkout-section">
                            <h2 class="checkout-section__title">Payment</h2>
                            <p class="checkout-info">This is a demo - no real payment will be processed.</p>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="terms-agree" required>
                                    <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Cancellation Policy</a></span>
                                </label>
                            </div>
                        </section>

                        <div class="checkout-actions">
                            <button type="button" class="btn btn-outline" id="cancel-booking">Cancel</button>
                            <button type="submit" class="btn btn-primary btn-lg">Complete Booking</button>
                        </div>
                    </form>
                </div>

                <!-- Order Summary -->
                <aside class="checkout-sidebar">
                    <div class="summary-card" id="order-summary">
                        <!-- Order summary loaded dynamically -->
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>
    <div class="toast-container" id="toast-container"></div>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="loader"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
